# ============================================================
#  HOTEL BACKEND — application.properties
# ============================================================

# --- Serveur ---
server.port=8080
server.servlet.context-path=/api

# --- Application ---
spring.application.name=hotel-backend

# --- Base de donnees MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# --- Pool de connexions HikariCP ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Jackson (JSON) ---
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# --- JWT ---
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# --- CORS ---
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Logs ---
logging.level.com.hotel=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================================
#  EMAIL — Configuration SMTP (JavaMail)
#  Remplacer les valeurs placeholder par les vraies coordonnées
#  du serveur SMTP en production.
# ============================================================

# Serveur SMTP (placeholder — à remplacer)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=noreply@hotel.com
spring.mail.password=CHANGE_ME_SMTP_PASSWORD

# Options de connexion TLS/STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Adresse d'expéditeur affichée dans les emails
spring.mail.from=noreply@hotel.com

# Nom de l'hôtel utilisé dans les emails
hotel.name=Hôtel

# Activation des méthodes @Async (nécessaire pour l'envoi asynchrone)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5